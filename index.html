<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>人狼オンライン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0d0f16;
  --bg-panel:#161927;
  --bg-panel-2:#1d2133;
  --ink:#ece8dd;
  --ink-dim:#8d90a6;
  --line:#2b2f42;
  --wolf:#b23a48;
  --wolf-glow:#7a2530;
  --village:#d8a657;
  --seer:#7c9cc4;
  --fox:#c07ad8;
  --radius:14px;
  --serif:'Shippori Mincho',serif;
  --sans:'Zen Kaku Gothic New',sans-serif;
}
*{box-sizing:border-box;}
html{
  zoom:0.85;
}
html,body{margin:0;padding:0;height:100%;}
body{
  background:
    radial-gradient(ellipse 1200px 600px at 50% -10%, #232840 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
*{word-break:normal;overflow-wrap:anywhere;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

.topbar{
  flex:none;display:flex;align-items:center;gap:14px;
  padding:14px 22px;border-bottom:1px solid var(--line);
  background:rgba(13,15,22,.7);backdrop-filter:blur(6px);
}
.moon{
  width:34px;height:34px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 35%, #fff8e6, var(--village) 70%);
  box-shadow:0 0 18px 2px rgba(216,166,87,.4);
  transition:background 1s ease, box-shadow 1s ease;
}
.moon.night{background:radial-gradient(circle at 35% 35%, #e9ecff, #4a4f78 70%);box-shadow:0 0 18px 2px rgba(120,140,255,.35);}
.moon.vote{background:radial-gradient(circle at 35% 35%, #ffd9d9, var(--wolf) 70%);box-shadow:0 0 18px 2px rgba(178,58,72,.5);}
.topbar h1{font-family:var(--serif);font-weight:800;font-size:19px;letter-spacing:.06em;margin:0;white-space:nowrap;}
.topbar .tagline{color:var(--ink-dim);font-size:10.5px;letter-spacing:.1em;margin-top:1px;white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .room-tag{color:var(--ink-dim);font-size:12px;margin-right:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
.gear-btn{
  width:36px;height:36px;border-radius:50%;flex:none;
  background:var(--bg-panel);border:1px solid var(--line);color:var(--ink-dim);
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.gear-btn:hover{color:var(--ink);border-color:#4a4f78;}

.main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
.center-wrap{flex:1;min-height:0;overflow-y:auto;display:flex;justify-content:center;padding:28px 18px 40px;}
.center-col{width:100%;max-width:560px;}

.game-layout{flex:1;min-height:0;display:flex;gap:0;}
.chat-col{flex:1 1 60%;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line);}
.side-col{flex:0 0 320px;max-width:38%;display:flex;flex-direction:column;overflow-y:auto;padding:16px;gap:14px;}

.panel{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:16px;}
.screen{display:none;}
.screen.active{display:flex;flex-direction:column;flex:1;min-height:0;}
#screen-menu.active,#screen-create.active,#screen-roomlist.active,#screen-nameentry.active,#screen-lobby.active,#screen-result.active{display:block;}

.btn{
  width:100%;padding:14px 18px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg-panel-2);color:var(--ink);font-family:var(--sans);font-size:15px;
  font-weight:700;cursor:pointer;margin-top:10px;
  transition:transform .15s ease, border-color .15s ease, background .15s ease;
  text-align:left;
}
.btn:hover{border-color:#4a4f78;transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn.primary{background:linear-gradient(135deg, var(--village), #b9822f);color:#1a1408;border:none;text-align:center;}
.btn.danger{background:linear-gradient(135deg, var(--wolf), var(--wolf-glow));color:#fff0ef;border:none;text-align:center;}
.btn.ghost{background:transparent;text-align:center;}
.btn.small{padding:9px 14px;font-size:13px;margin-top:0;width:auto;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.field{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;margin-top:8px;}
.field:focus{outline:none;border-color:var(--village);}
select.field{appearance:none;}
.label{font-size:12px;color:var(--ink-dim);letter-spacing:.08em;margin-top:14px;}
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--village);font-weight:700;margin-bottom:8px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.room-row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);gap:10px;}
.room-row:last-child{border-bottom:none;}
.room-name{font-weight:700;}
.room-name .lock{color:var(--village);margin-right:4px;}
.room-meta{color:var(--ink-dim);font-size:12px;margin-top:2px;}
.empty{color:var(--ink-dim);font-size:13px;padding:14px 4px;text-align:center;}
.errtext{color:#ff9aa4;font-size:12.5px;margin-top:8px;min-height:1em;}
.checkline{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;}

.player-list{display:flex;flex-direction:column;gap:8px;}
.p-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--bg-panel-2);border:1px solid var(--line);font-size:13.5px;}
.p-row.me{border-color:var(--village);}
.p-row.dead{opacity:.4;text-decoration:line-through;}
.p-row.spectator{opacity:.55;font-style:italic;}
.p-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.p-row .xfer{border:none;background:transparent;color:var(--ink-dim);cursor:pointer;font-size:11px;text-decoration:underline;padding:0;flex:none;}
.p-row .mtn-btn{border:none;background:transparent;color:var(--seer);cursor:pointer;font-size:14px;padding:0 2px;flex:none;}
.p-row .revealed{font-size:11px;color:var(--ink-dim);flex:none;}
.p-row .known-role{font-size:11px;color:var(--seer);flex:none;}

.phase-bar{display:flex;justify-content:space-between;align-items:baseline;padding:14px 18px;border-bottom:1px solid var(--line);flex:none;}
.phase-title{font-family:var(--serif);font-size:19px;font-weight:700;}
.timer{font-variant-numeric:tabular-nums;color:var(--ink-dim);font-size:13px;}
.role-badge{display:inline-block;padding:6px 14px;border-radius:20px;font-weight:700;font-size:12.5px;}
.role-badge.village-team{background:rgba(216,166,87,.18);color:#f0c884;border:1px solid var(--village);}
.role-badge.wolf-team{background:rgba(178,58,72,.18);color:#ff8f9a;border:1px solid var(--wolf);}
.role-badge.third-team{background:rgba(192,122,216,.18);color:#e3b6f4;border:1px solid var(--fox);}
.role-desc-box{margin-top:8px;font-size:12.5px;color:var(--ink-dim);}

.action-area{padding:14px 18px;border-bottom:1px solid var(--line);flex:none;}
.target-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.target{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;}
.target.selected{border-color:var(--village);background:var(--bg-panel-2);}
.target.disabled{opacity:.4;cursor:not-allowed;}

.chat-tabs{display:flex;gap:4px;padding:10px 14px 0;flex:none;overflow-x:auto;scrollbar-width:none;}
.chat-tabs::-webkit-scrollbar{display:none;}
.chat-tab{padding:7px 12px;border-radius:8px 8px 0 0;font-size:12.5px;color:var(--ink-dim);cursor:pointer;border:1px solid var(--line);border-bottom:none;background:var(--bg-panel);white-space:nowrap;flex:none;}
.chat-tab.active{color:var(--ink);background:var(--bg-panel-2);font-weight:700;}
.chat-tab.locked{opacity:.35;cursor:not-allowed;}

.chat-body{flex:1;min-height:0;display:flex;flex-direction:column;}
.log{flex:1;min-height:0;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:8px;}
.msg{font-size:13.5px;line-height:1.5;}
.msg .mfrom{font-weight:700;color:var(--village);margin-right:6px;}
.msg.self .mfrom{color:var(--seer);}
.msg .mreply{font-size:11.5px;color:var(--ink-dim);border-left:2px solid var(--line);padding-left:8px;margin-bottom:2px;}
.msg .mtext .mention{color:var(--seer);font-weight:700;}
.msg.sys{color:var(--village);font-style:normal;}
.reply-bar{display:none;align-items:center;gap:8px;padding:6px 18px;font-size:12px;color:var(--ink-dim);border-top:1px solid var(--line);}
.reply-bar.show{display:flex;}
.reply-bar .rb-close{cursor:pointer;color:var(--wolf);font-weight:700;}
.chat-row{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex:none;}
.chat-row .field{margin-top:0;}
.chat-locked-note{padding:12px 18px;color:var(--ink-dim);font-size:12.5px;border-top:1px solid var(--line);}

.banner{background:rgba(178,58,72,.14);border:1px solid var(--wolf);color:#ff9aa4;padding:10px 18px;font-size:12.5px;flex:none;}
.spectator-banner{background:rgba(124,156,196,.14);border:1px solid var(--seer);color:#a9c6e8;padding:10px 18px;font-size:12.5px;flex:none;}
.result-title{font-family:var(--serif);font-size:30px;font-weight:800;text-align:center;margin:18px 0 6px;}
.center{text-align:center;}
.muted{color:var(--ink-dim);font-size:13px;}
.back-link{color:var(--ink-dim);font-size:13px;cursor:pointer;display:inline-block;margin-top:14px;}
.back-link:hover{color:var(--ink);}
.link{color:var(--seer);font-size:12px;cursor:pointer;text-decoration:underline;}
.modal-overlay{position:fixed;inset:0;background:rgba(6,7,12,.86);display:flex;align-items:center;justify-content:center;z-index:900;padding:20px;}
.modal-overlay.hidden{display:none;}
.modal-box{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;max-width:460px;width:100%;max-height:80vh;overflow-y:auto;}
.role-info-item{border-bottom:1px solid var(--line);padding:12px 0;}
.role-info-item:last-child{border-bottom:none;}
.role-info-item b{font-family:var(--serif);}
.role-info-item .fac{font-size:11px;color:var(--ink-dim);letter-spacing:.08em;}
.debug-box{margin-top:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:220px;overflow-y:auto;font-size:11px;color:var(--ink-dim);font-family:monospace;white-space:pre-wrap;word-break:break-all;}

.mention-pop{position:absolute;bottom:52px;left:18px;background:var(--bg-panel-2);border:1px solid var(--line);border-radius:8px;overflow:hidden;z-index:50;min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.mention-pop.hidden{display:none;}
.mention-pop .mi{padding:8px 12px;font-size:13px;cursor:pointer;}
.mention-pop .mi:hover{background:var(--bg-panel);}

@media (max-width: 780px){
  .game-layout{flex-direction:column;}
  .chat-col{border-right:none;border-bottom:1px solid var(--line);flex:1 1 55%;}
  .side-col{flex:1 1 45%;max-width:none;flex-direction:row;flex-wrap:wrap;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="moon" id="moonIcon"></div>
  <div>
    <h1>人狼オンライン</h1>
    <div class="tagline">JINRO ONLINE ROOM &mdash; SERVER MODE</div>
  </div>
  <div class="spacer"></div>
  <div class="room-tag" id="topRoomTag"></div>
  <button class="gear-btn" onclick="openSettings()">⚙</button>
</div>

<div class="main">

  <div id="screen-menu" class="screen active">
    <div class="center-wrap"><div class="center-col">
      <div class="panel">
        <div class="eyebrow">メニュー</div>
        <button class="btn" onclick="startJoinFlow('official')">公式部屋に参加する</button>
        <button class="btn" onclick="startJoinFlow('create')">部屋を作成する</button>
        <button class="btn" onclick="startJoinFlow('list')">既存の部屋に参加する</button>
        <div class="link" style="margin-top:14px;display:inline-block" onclick="openRoleInfo()">ルールブックを見る（進行ルール・全13役職）</div>
      </div>
    </div></div>
  </div>

  <div id="screen-create" class="screen">
    <div class="center-wrap"><div class="center-col">
      <div class="panel">
        <div class="eyebrow">部屋を作成</div>
        <div class="label">部屋名</div>
        <div class="row2">
          <input id="createRoomInput" class="field" maxlength="40" placeholder="自動生成されます" readonly>
          <button class="btn small" style="margin-top:8px" onclick="regenRoomName()">再生成</button>
        </div>
        <div class="row2">
          <div>
            <div class="label">最大人数</div>
            <input id="maxPlayersInput" type="number" class="field" min="5" max="20" value="10">
          </div>
          <div>
            <div class="label">Botの数（空欄で自動）</div>
            <input id="botCountInput" type="number" class="field" min="0" max="19" placeholder="自動">
          </div>
        </div>
        <div class="label">パスワード（任意・空欄なら誰でも参加可）</div>
        <input id="roomPasswordInput" class="field" type="text" maxlength="20" placeholder="設定しない場合は空欄">
        <button class="btn primary" style="margin-top:16px" onclick="proceedToName('create')">次へ（表示名を決める）</button>
        <div id="createError" class="errtext"></div>
      </div>
      <div class="back-link" onclick="showScreen('screen-menu')">&larr; メニューに戻る</div>
    </div></div>
  </div>

  <div id="screen-roomlist" class="screen">
    <div class="center-wrap"><div class="center-col">
      <div class="panel">
        <div class="eyebrow">部屋一覧</div>
        <div id="roomListBody"><div class="empty">読み込み中...</div></div>
        <button class="btn small" style="margin-top:14px" onclick="refreshRoomList()">更新</button>
      </div>
      <div class="back-link" onclick="showScreen('screen-menu')">&larr; メニューに戻る</div>
    </div></div>
  </div>

  <div id="screen-nameentry" class="screen">
    <div class="center-wrap"><div class="center-col">
      <div class="panel">
        <div class="eyebrow">参加名を確認</div>
        <div class="muted" id="nameEntryRoomLabel" style="margin-bottom:6px"></div>
        <div class="label" id="pwLabel" style="display:none">この部屋のパスワード</div>
        <input id="roomPasswordJoinInput" class="field" type="text" maxlength="20" placeholder="パスワード" style="display:none">
        <div class="label">あなたの参加名（自動生成）</div>
        <div class="row2">
          <input id="nameInput" class="field" readonly>
          <button class="btn small" style="margin-top:8px" onclick="regenParticipantName()">再生成</button>
        </div>
        <button class="btn primary" style="margin-top:16px" onclick="confirmNameAndJoin()">この名前で入室する</button>
        <div id="nameError" class="errtext"></div>
      </div>
      <div class="back-link" onclick="showScreen('screen-menu')">&larr; メニューに戻る</div>
    </div></div>
  </div>

  <div id="screen-lobby" class="screen">
    <div id="lobbyBanner"></div>
    <div class="center-wrap"><div class="center-col">
      <div class="panel">
        <div class="eyebrow" id="lobbyRoomName">部屋</div>
        <div class="muted" id="lobbySpecNote" style="margin-bottom:8px"></div>
        <div class="player-list" id="lobbyPlayers"></div>
        <button class="btn primary" id="startBtn" style="margin-top:18px;display:none" onclick="hostStartGame()">ゲームを開始する</button>
        <div class="muted" id="lobbyWaitNote" style="margin-top:10px"></div>
        <div class="link" style="margin-top:10px;display:inline-block" onclick="openRoleInfo()">役職について見る</div>
        <div class="log" id="lobbyLog" style="max-height:180px;padding:10px 0 0"></div>
        <div class="chat-row" style="padding:10px 0 0;border-top:none">
          <input id="lobbyChatInput" class="field" placeholder="チャット..." onkeydown="if(event.key==='Enter')sendChat('lobbyChatInput')">
          <button class="btn small" onclick="sendChat('lobbyChatInput')">送信</button>
        </div>
      </div>
      <div class="back-link" onclick="leaveRoom()">&larr; 退出する</div>
    </div></div>
  </div>

  <div id="screen-game" class="screen">
    <div id="gameBanner"></div>
    <div class="game-layout">
      <div class="chat-col">
        <div class="phase-bar">
          <div class="phase-title" id="phaseTitle">夜</div>
          <div class="timer" id="phaseTimer">--</div>
        </div>
        <div class="action-area" id="actionArea"></div>
        <div class="chat-tabs" id="chatTabs"></div>
        <div class="chat-body">
          <div class="log" id="gameLog"></div>
          <div class="reply-bar" id="replyBar">
            <span id="replyBarText"></span>
            <span class="rb-close" onclick="clearReply()">✕</span>
          </div>
          <div id="chatLockedNote" class="chat-locked-note" style="display:none">このチャンネルでは現在発言できません</div>
          <div class="chat-row" id="chatInputRow" style="position:relative">
            <div class="mention-pop hidden" id="mentionPop"></div>
            <input id="gameChatInput" class="field" placeholder="チャット... (@でメンション)" oninput="onChatInputChange()" onkeydown="onChatKeydown(event)">
            <button class="btn small" id="gameChatBtn" onclick="sendChat('gameChatInput')">送信</button>
          </div>
        </div>
      </div>
      <div class="side-col">
        <div>
          <div class="label" style="margin-top:0">あなたの役職</div>
          <div id="roleBadgeWrap" style="margin-top:8px"></div>
        </div>
        <div>
          <div class="label" style="margin-top:0">参加者</div>
          <div class="player-list" id="gamePlayers" style="margin-top:8px"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="screen-result" class="screen">
    <div class="center-wrap"><div class="center-col">
      <div class="panel center">
        <div class="result-title" id="resultTitle"></div>
        <div class="muted" id="resultSub"></div>
        <button class="btn primary" style="margin-top:20px" onclick="backToLobbyScreen()">ロビーに戻る</button>
      </div>
    </div></div>
  </div>

</div>

<div class="modal-overlay hidden" id="settingsModal" onclick="if(event.target===this) closeSettings()">
  <div class="modal-box">
    <div class="eyebrow">設定</div>
    <div class="checkline">
      <input type="checkbox" id="debugToggle" onchange="toggleDebugMode()">
      <label for="debugToggle">デバッグモード（接続エラー・成功ログを表示）</label>
    </div>
    <div id="debugSection" style="display:none">
      <div class="debug-box" id="debugBox"></div>
      <button class="btn small" style="margin-top:8px" onclick="copyDebugLogs()">ログをコピー</button>
    </div>
    <button class="btn ghost" style="margin-top:18px" onclick="closeSettings()">閉じる</button>
  </div>
</div>

<div class="modal-overlay hidden" id="roleInfoModal" onclick="if(event.target===this) closeRoleInfo()">
  <div class="modal-box">
    <div class="eyebrow">ルールブック</div>
    <div id="roleInfoList"></div>
    <button class="btn ghost" style="margin-top:8px" onclick="closeRoleInfo()">閉じる</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://gzszxogwrxqmlksqfjma.supabase.co";
const SUPABASE_KEY = "sb_publishable_iP2uXd88GR_osFMyYDykTA_O8tyodQZ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ROOM_PREFIX = "JinrouOnlineRoom";
const OFFICIAL_KEY = ROOM_PREFIX + "Official";
const MIN_PLAYERS = 5;
const NIGHT_MS = 60000;
const DAY_MS = 45000;
const VOTE_MS = 20000;
/* 全員ボット時は超高速進行にする */
const NIGHT_MS_FAST = 6000;
const DAY_MS_FAST = 10000;
const VOTE_MS_FAST = 5000;
const PRESENCE_STALE_MS = 20000;

function humansRemainingAlive(){
  return players.some(p=>!p.is_bot && !p.is_spectator && p.alive);
}
function onlyBotsLeft(){
  const nonGm = players.filter(p=>p.bot_kind!=='gm');
  if(nonGm.length===0) return false;
  return !humansRemainingAlive();
}
function nightDurationMs(){ return onlyBotsLeft() ? NIGHT_MS_FAST : NIGHT_MS; }
function dayDurationMs(){ return onlyBotsLeft() ? DAY_MS_FAST : DAY_MS; }
function voteDurationMs(){ return onlyBotsLeft() ? VOTE_MS_FAST : VOTE_MS; }

/* ---------- 役職定義（13種） ---------- */
const ROLE_INFO = {

const words1 = ["Alpha","Shadow","Ghost","Cyber","Dark","Neon","Lunar","Solar","Hyper","Sonic","Mystic","Phantom","Cosmic","Quantum","Omega","Delta","Vector","Apex","Matrix","Vortex","Blaze","Frost","Iron","Steel","Chaos","Astra","Pixel","Crypto","Retro","Binary","Aero","Nitro","Prism","Savage","Giga","Mega","Micro","Titan","Rogue","Fallen"];
const words2 = ["Wolf","Knight","Hunter","Blade","Rider","Phoenix","Dragon","Striker","Ranger","Viper","Slayer","Titan","Specter","Oracle","Beast","Demon","Angel","Reaper","Ninja","Samurai","Scout","Pilot","Soldier","Warrior","Hacker","Wizard","Mage","Gamer","Bot","Glitch","Chaser","Runner","Walker","Breaker","Maker","Master","Lord","King","Queen","Fox"];
function generateGameTag(){
  const w1 = words1[Math.floor(Math.random()*words1.length)];
  const w2 = words2[Math.floor(Math.random()*words2.length)];
  const num = String(Math.floor(10000000 + Math.random()*90000000));
  return w1 + w2 + num;
}

async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}

async function confirmNameAndJoin(){
  const nameInput = document.getElementById('nameInput');
  const errEl = document.getElementById('nameError');
  const name = nameInput.value.trim();
  errEl.textContent = '';
  if(!name){ errEl.textContent = '表示名を入力してください'; nameInput.focus(); return; }
  if(!joinIntent){ showScreen('screen-menu'); return; }

  const key = joinIntent.key;

  if(joinIntent.kind === 'create'){
    let pwHash = null;
    if(joinIntent.createSettings.password) pwHash = await sha256Hex(joinIntent.createSettings.password);
    const { error: roomErr } = await sb.from('rooms').insert({
      room_key: key, room_name: joinIntent.name, is_official: false,
      max_players: joinIntent.createSettings.maxPlayers,
      bot_count: joinIntent.createSettings.botCount,
      password_hash: pwHash,
      phase: 'lobby', round: 0, state: {}
    });
    if(roomErr && roomErr.code !== '23505'){
      errEl.textContent = '部屋の作成に失敗しました';
      debugLog('error', '部屋作成失敗: ' + roomErr.message);
      return;
    }
    if(!roomErr){
      await sb.from('room_players').insert({ room_key:key, client_id:'gm_'+key, name:'ゲームマスター', is_bot:true, bot_kind:'gm', alive:true, is_spectator:false });
    }
  }else if(joinIntent.kind === 'official'){
    const { data: existing } = await sb.from('rooms').select('room_key').eq('room_key', key).maybeSingle();
    if(!existing){
      await sb.from('rooms').insert({ room_key: key, room_name: '公式部屋', is_official: true, max_players: 16, bot_count: -1, password_hash:null, phase: 'lobby', round: 0, state: {} });
      await sb.from('room_players').insert({ room_key:key, client_id:'gm_'+key, name:'ゲームマスター', is_bot:true, bot_kind:'gm', alive:true, is_spectator:false });
    }
  }else if(joinIntent.kind === 'join' && joinIntent.needsPassword){
    const { data: roomRowChk } = await sb.from('rooms').select('password_hash').eq('room_key', key).maybeSingle();
    const pw = document.getElementById('roomPasswordJoinInput').value;
    const hash = pw ? await sha256Hex(pw) : null;
    if(!roomRowChk || roomRowChk.password_hash !== hash){
      errEl.textContent = 'パスワードが正しくありません';
      return;
    }
  }

  const { data: roomRow, error: roomFetchErr } = await sb.from('rooms').select('*').eq('room_key', key).maybeSingle();
  if(roomFetchErr || !roomRow){
    errEl.textContent = '部屋が見つかりませんでした';
    debugLog('error', '部屋取得失敗: ' + (roomFetchErr ? roomFetchErr.message : 'not found'));
    return;
  }

  const { data: existingPlayers } = await sb.from('room_players').select('name,client_id,is_bot,is_spectator').eq('room_key', key);
  const myExisting = (existingPlayers||[]).find(p=>p.client_id===clientId);
  const humanNonSpec = (existingPlayers||[]).filter(p=>!p.is_bot && !p.is_spectator && p.client_id!==clientId).length;

  let becomeSpectator = false;
  if(!myExisting){
    if(roomRow.phase !== 'lobby'){
      becomeSpectator = true;
    }else if(humanNonSpec >= (roomRow.max_players || 10)){
      becomeSpectator = true;
    }
  }

  myName = name;
  roomKey = key;
  roomName = roomRow.room_name;

  if(myExisting){
    const { error: upErr } = await sb.from('room_players').update({ name, last_seen: new Date().toISOString() }).eq('room_key', key).eq('client_id', clientId);
    if(upErr){ errEl.textContent = '入室に失敗しました'; debugLog('error','update失敗:'+upErr.message); return; }
  }else{
    const { error: insErr } = await sb.from('room_players').insert({ room_key: key, client_id: clientId, name, is_bot: false, alive: true, is_spectator: becomeSpectator });
    if(insErr){
      errEl.textContent = '入室に失敗しました';
      debugLog('error','insert失敗:'+insErr.message);
      return;
    }
    debugLog('ok', '部屋に入室しました: ' + key + (becomeSpectator?'（観戦者として）':''));
  }

  await enterRoomRuntime();
}

  players = ps || players || [];
  const { data: msgs, error: mErr } = await sb.from('room_messages').select('*').eq('room_key', roomKey).order('id', { ascending:true }).limit(400);

}

/* ---------- GM Bot: 進行専任の楽観的アドバンス ---------- */

async function checkPhaseTimeout(){
  if(!room || advanceLock) return;
  if(room.phase === 'lobby' || room.phase === 'ended') return;
  if(!room.phase_end_at) return;
  if(Date.now() < new Date(room.phase_end_at).getTime()) return;
  await gmTryAdvancePhase();
}

/*
 修正点: 従来はphaseだけを条件にした楽観ロックだったため、
 複数クライアントがほぼ同時に「成功」を判定できてしまう隙があった。
 phase_end_at も一致条件に加え、それをnullに書き換えることで
 実際にDB上でロックを奪えたクライアントだけが後続処理を行うようにする。
*/
async function gmTryAdvancePhase(){
  if(advanceLock) return;
  advanceLock = true;
  try{
    const expectedPhase = room.phase;
    const expectedEndAt = room.phase_end_at;
    const { data, error } = await sb.from('rooms')
      .update({ phase_end_at: null, updated_at: new Date().toISOString() })
      .eq('room_key', roomKey)
      .eq('phase', expectedPhase)
      .eq('phase_end_at', expectedEndAt)
      .select().maybeSingle();
    if(error || !data){ advanceLock = false; return; }
    if(expectedPhase === 'night') await resolveNight();
    else if(expectedPhase === 'day') await startVotePhase();
    else if(expectedPhase === 'vote') await resolveVote();
  }catch(e){
    debugLog('error','GM Bot進行処理でエラー: ' + e.message);
  }
  advanceLock = false;
}

 （humanPlayersに観戦者を含めるかどうかがブレていた）、意図した人が実行できない、
 または誰も実行しないケースがあった。判定を「非観戦の人間プレイヤーの先頭」で統一する。
*/
async function promoteSpectatorsIfHost(){
  const nonSpectatorHumans = players.filter(p=>!p.is_bot && !p.is_spectator);
  const amFirst = nonSpectatorHumans.length>0 && nonSpectatorHumans[0].client_id===clientId;

  if(!cur || cur.length===0) return;
  await sb.from('room_players').update({ is_spectator:false }).eq('room_key', roomKey).eq('is_spectator', true).eq('is_bot', false);
  debugLog('ok', '観戦者をプレイヤーへ昇格しました');

async function hostStartGame(){
  const humanPlayers = players.filter(p=>!p.is_bot && !p.is_spectator);
  const amFirst = humanPlayers.length > 0 && humanPlayers[0].client_id === clientId;
  if(!amFirst) return;

  let botCount = (room.bot_count !== undefined && room.bot_count !== null && room.bot_count >= 0) ? room.bot_count : -1;
  if(botCount < 0){
    if(humanPlayers.length >= 5){
      botCount = 0;
    }else{
      const targetTotal = Math.max(5, Math.min(20, Math.round(8 + Math.random()*4)));
      botCount = Math.max(0, targetTotal - humanPlayers.length);
    }
  }
  const total = humanPlayers.length + botCount;
  if(total < MIN_PLAYERS) return;

  const bots = spawnRoleBots(botCount);
  if(bots.length){
    await sb.from('room_players').insert(bots.map(b=>({ room_key: roomKey, client_id: b.client_id, name: b.name, is_bot: true, bot_kind:'role', bot_level: b.bot_level, alive: true, is_spectator:false })));
  }

  const { data: rosterAll } = await sb.from('room_players').select('*').eq('room_key', roomKey);
  const roster = (rosterAll||[]).filter(p=>p.bot_kind !== 'gm' && !p.is_spectator);

  const ids = roster.map(p=>p.client_id);
  for(let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
  const n = ids.length;
  const roleMap = assignRoles(ids, n);

  const twinIds = ids.filter(id=>roleMap[id]==='twin');
  const masonIds = ids.filter(id=>roleMap[id]==='mason');
  const fanaticIds = ids.filter(id=>roleMap[id]==='fanatic');
  const wolfIds = ids.filter(id=>roleMap[id]==='werewolf'||roleMap[id]==='direwolf');

  const updates = ids.map((id,i)=>{
    const upd = { role: roleMap[id], alive:true, seat_order: i, twin_group: null };
    if(roleMap[id]==='twin' && twinIds.length===2) upd.twin_group = 'twin_pair';
    if(roleMap[id]==='mason' && masonIds.length===2) upd.twin_group = 'mason_pair';
    return sb.from('room_players').update(upd).eq('room_key', roomKey).eq('client_id', id);
  });
  await Promise.all(updates);

  await postMessage('lobby', null, null, null, null, null, 'ゲームが始まりました');
  await sb.from('rooms').update({
    phase: 'night', round: 1,
    phase_end_at: new Date(Date.now() + NIGHT_MS).toISOString(),
    state: {
      nightActions: {}, votes: {}, deaths: [],
      seatOrder: ids, wolfIds, fanaticIds, medium_last_executed: null
    },
    updated_at: new Date().toISOString()
  }).eq('room_key', roomKey);
  await postMessage('alive', null, null, null, null, null, '1日目の夜になりました');
}

/*
 修正点: 人狼陣営の中核である「人狼」と「狂人」を、それぞれ最大2体までに固定した。
 direwolf(大狼)は人狼の1体を置き換えるもの、fanatic(狂信者)は狂人の1体を置き換えるものとし、
 陣営全体の人数はこれまで通り増やさない。
 これにより、大人数の部屋でも人狼側が過剰に多くなってバランスが崩れることを防ぐ。
*/
function assignRoles(ids, n){
  const roleMap = {};
  let pool = [];

  const wolfCount   = n >= 8 ? 2 : 1;                 // 5〜7人:1体, 8人以上:2体（最大2）
  const madmanCount = n >= 9 ? 2 : (n >= 6 ? 1 : 0);  // 6〜8人:1体, 9人以上:2体（最大2）

  for(let i=0;i<wolfCount;i++) pool.push('werewolf');
  for(let i=0;i<madmanCount;i++) pool.push('madman');

  if(n>=9 && pool.indexOf('madman')!==-1){
    pool[pool.indexOf('madman')] = 'fanatic';
  }
  if(n>=12 && pool.indexOf('werewolf')!==-1){
    pool[pool.indexOf('werewolf')] = 'direwolf';
  }

  const thirdEnabled = n >= 6;

  pool.push('seer');
  if(n>=7) pool.push('medium');
  if(n>=6) pool.push('knight');
  if(n>=8){ pool.push('mason'); pool.push('mason'); }
  if(n>=10) pool.push('catghost');
  if(thirdEnabled) pool.push('fox');
  if(n>=9) pool.push('teruteru');
  if(n>=12 && pool.filter(r=>r!=='villager').length < n){ pool.push('twin'); pool.push('twin'); }

  while(pool.length < n) pool.push('villager');
  pool = pool.slice(0, n);

  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  ids.forEach((id,i)=>{ roleMap[id] = pool[i]; });
  return roleMap;
}

const BOT_NAMES = NAME_POOL;
function spawnRoleBots(count){
  const used = new Set(players.map(p=>p.name));
  const bots = [];
  for(let i=0;i<count;i++){
    const name = pickUnusedName(Array.from(used));
    used.add(name);
    const level = 1 + Math.floor(Math.random()*3);
    bots.push({ client_id: 'bot_' + uuid(), name, bot_level: level });
  }
  return bots;
}

/* ---------- 夜/昼/投票 進行 ---------- */

function aliveOf(role){ return players.filter(p=>p.alive && p.role===role); }
function aliveWolvesAndDire(){ return players.filter(p=>p.alive && (p.role==='werewolf'||p.role==='direwolf')); }

/* 参加者一覧に表示する「判明している役職」（同役職同士・狂信者→人狼など） */
function knownRoleOf(viewer, target){
  if(!viewer || !target) return null;
  if(viewer.client_id === target.client_id) return target.role;
  if(viewer.twin_group && viewer.twin_group === target.twin_group) return target.role;
  const wolfRoles = ['werewolf','direwolf'];
  if(wolfRoles.includes(viewer.role) && wolfRoles.includes(target.role)) return target.role;
  if(viewer.role === 'fanatic' && wolfRoles.includes(target.role)) return target.role;
  return null;
}

async function handleNightAction(targetId){
  const me = players.find(p=>p.client_id===clientId);
  if(!me || !me.alive || room.phase !== 'night' || amSpectator) return;
  const actingRoles = ['werewolf','direwolf','seer','medium','knight'];
  if(!actingRoles.includes(me.role)) return;
  const { data: cur } = await sb.from('rooms').select('state').eq('room_key', roomKey).maybeSingle();
  const state = cur ? cur.state : room.state;
  state.nightActions = state.nightActions || {};
  state.nightActions[clientId] = { role: me.role, target: targetId };
  await sb.from('rooms').update({ state, updated_at: new Date().toISOString() }).eq('room_key', roomKey);
  room.state = state;

  if(me.role === 'seer'){
    const targetP = players.find(p=>p.client_id===targetId);
    if(targetP){
      const isWolf = targetP.role === 'werewolf';
      const isFox = targetP.role === 'fox';
      seerResult = { target: targetP.name, isWerewolf: isWolf, isFox };
      if(isFox){
        await sb.from('room_players').update({ alive:false }).eq('room_key', roomKey).eq('client_id', targetId);
        await postMessage('alive', null, null, null, null, null, '占いの結果、' + targetP.name + ' は静かに息を引き取りました');
      }
      renderCurrentScreen();
    }
  }
  if(me.role === 'medium'){
    const lastExec = (room.state && room.state.medium_last_executed) || null;
    if(lastExec){
      const targetP = players.find(p=>p.client_id===lastExec);
      if(targetP){ mediumResult = { target: targetP.name, isWerewolf: targetP.role==='werewolf' }; renderCurrentScreen(); }
    }
  }

  await maybeAdvanceFromNightActions(state);
}

async function maybeAdvanceFromNightActions(state){
  const wolves = aliveWolvesAndDire().map(p=>p.client_id);
  const seers = aliveOf('seer').map(p=>p.client_id);
  const knights = aliveOf('knight').map(p=>p.client_id);
  const allWolvesActed = wolves.every(id=> state.nightActions[id]);
  const allSeersActed = seers.every(id=> state.nightActions[id]);
  const allKnightsActed = knights.every(id=> state.nightActions[id]);
  /* 全ての夜行動役職が行動を終えたら、タイマーを待たずに即座に夜を終了する */
  if(allWolvesActed && allSeersActed && allKnightsActed) await gmTryAdvancePhase();
}

async function resolveNight(){
  const { data: cur } = await sb.from('rooms').select('*').eq('room_key', roomKey).maybeSingle();
  if(!cur || cur.phase !== 'night') return;
  const state = cur.state || {};
  const actions = state.nightActions || {};
  const { data: currentPlayers } = await sb.from('room_players').select('*').eq('room_key', roomKey);

  const tally = {};
  Object.values(actions).forEach(a=>{ if(a.role==='werewolf'||a.role==='direwolf') tally[a.target] = (tally[a.target]||0)+1; });
  let killTarget = null, max = 0;
  Object.entries(tally).forEach(([id,c])=>{ if(c>max){ max=c; killTarget=id; } });

  let guardedId = null;
  Object.values(actions).forEach(a=>{ if(a.role==='knight') guardedId = a.target; });
  /* 騎士が強すぎて決着がつかない問題への対処: 護衛は一定確率で失敗する（貫通）ようにする */
  const guardPenetrates = Math.random() < 0.3;
  if(guardPenetrates) guardedId = null;

  const deaths = [];
  let cascadeMsgs = [];

  if(killTarget && killTarget !== guardedId){
    const victim = currentPlayers.find(p=>p.client_id===killTarget);
    if(victim && victim.alive){
      if(victim.role === 'catghost'){
        await sb.from('room_players').update({ alive:false }).eq('room_key', roomKey).eq('client_id', killTarget);
        deaths.push(victim.name);
        const wolfActorIds = Object.entries(actions).filter(([id,a])=>(a.role==='werewolf'||a.role==='direwolf') && a.target===killTarget).map(([id])=>id);
        if(wolfActorIds.length){
          const doomed = wolfActorIds[Math.floor(Math.random()*wolfActorIds.length)];
          const doomedP = currentPlayers.find(p=>p.client_id===doomed);
          if(doomedP){
            await sb.from('room_players').update({ alive:false }).eq('room_key', roomKey).eq('client_id', doomed);
            deaths.push(doomedP.name);
            cascadeMsgs.push('猫又が道連れにしました');
          }
        }
      }else{
        await sb.from('room_players').update({ alive:false }).eq('room_key', roomKey).eq('client_id', killTarget);
        deaths.push(victim.name);
      }
    }
  }

  const updatedPlayers = currentPlayers.map(p=> deaths.includes(p.name) ? Object.assign({},p,{alive:false}) : p);
  for(const p of updatedPlayers){
    if(!p.alive && p.twin_group === 'twin_pair'){
      const partner = updatedPlayers.find(x=>x.twin_group==='twin_pair' && x.client_id!==p.client_id && x.alive);
      if(partner){
        await sb.from('room_players').update({ alive:false }).eq('room_key', roomKey).eq('client_id', partner.client_id);
        deaths.push(partner.name);
        cascadeMsgs.push('双子の後を追いました');
      }
    }
  }

  await postMessage('alive', null, null, null, null, null, deaths.length ? (deaths.join('、') + ' が無残な姿で見つかりました') : '今夜、犠牲者はいませんでした');
  for(const m of cascadeMsgs){ await postMessage('alive', null, null, null, null, null, m); }

  const finalPlayers = currentPlayers.map(p=> deaths.includes(p.name) ? Object.assign({},p,{alive:false}) : p);
  const winner = computeWinner(finalPlayers);
  if(winner){ await endGame(winner); return; }

  if(computeOnlyBots(finalPlayers)){
    await postMessage('alive', null, null, null, null, null, '生存者が全員ボットになったため、進行を終了します');
    await sb.from('rooms').update({ phase:'ended', state: Object.assign({}, state, { deaths, winner:'no_humans' }) }).eq('room_key', roomKey);
    return;
  }

  const dur = computeOnlyBots(finalPlayers) ? NIGHT_MS_FAST : dayDurationMs();
  await sb.from('rooms').update({
    phase: 'day',
    phase_end_at: new Date(Date.now() + dur).toISOString(),
    state: Object.assign({}, state, { deaths })
  }).eq('room_key', roomKey).eq('phase','night');
}

function computeOnlyBots(playerList){
  const nonGm = playerList.filter(p=>p.bot_kind!=='gm');
  if(nonGm.length===0) return false;
  return !nonGm.some(p=>!p.is_bot && !p.is_spectator && p.alive);
}

async function startVotePhase(){
  const { data: cur } = await sb.from('rooms').select('*').eq('room_key', roomKey).maybeSingle();
  if(!cur || cur.phase !== 'day') return;
  await postMessage('alive', null, null, null, null, null, '投票の時間です');
  await sb.from('rooms').update({
    phase: 'vote',
    phase_end_at: new Date(Date.now() + voteDurationMs()).toISOString(),
    state: Object.assign({}, cur.state, { votes: {} })
  }).eq('room_key', roomKey).eq('phase','day');
}

async function handleVote(targetId){
  const me = players.find(p=>p.client_id===clientId);
  if(!me || !me.alive || room.phase !== 'vote' || amSpectator) return;
  const { data: cur } = await sb.from('rooms').select('state').eq('room_key', roomKey).maybeSingle();
  const state = cur ? cur.state : room.state;
  state.votes = state.votes || {};
  state.votes[clientId] = targetId;
  await sb.from('rooms').update({ state, updated_at: new Date().toISOString() }).eq('room_key', roomKey);
  room.state = state;
  const aliveCount = players.filter(p=>p.alive && p.bot_kind!=='gm').length;
  if(Object.keys(state.votes).length >= aliveCount) await gmTryAdvancePhase();
}

async function resolveVote(){
  const { data: cur } = await sb.from('rooms').select('*').eq('room_key', roomKey).maybeSingle();
  if(!cur || cur.phase !== 'vote') return;
  const state = cur.state || {};
  const votes = state.votes || {};
  const tally = {};
  Object.values(votes).forEach(t=>{ tally[t]=(tally[t]||0)+1; });
  let top=null,max=0,tie=false;
  Object.entries(tally).forEach(([id,c])=>{
    if(c>max){ max=c; top=id; tie=false; } else if(c===max){ tie=true; }
  });
  const { data: currentPlayers } = await sb.from('room_players').select('*').eq('room_key', roomKey);
  let updatedPlayers = currentPlayers;
  let executedId = null;
  let teruteruWin = false;
  let cascadeDeaths = [];

  if(top && !tie){
    const executed = currentPlayers.find(p=>p.client_id===top);
    if(executed){
      await sb.from('room_players').update({ alive:false }).eq('room_key', roomKey).eq('client_id', top);
      executedId = top;
      await postMessage('alive', null, null, null, null, null, executed.name + ' が処刑されました');
      updatedPlayers = currentPlayers.map(p=> p.client_id===top ? Object.assign({},p,{alive:false}) : p);
      if(executed.role === 'teruteru'){
        teruteruWin = true;
      }
      if(executed.role === 'catghost'){
        const others = updatedPlayers.filter(p=>p.alive && p.client_id!==executed.client_id);
        if(others.length){
          const doomed = others[Math.floor(Math.random()*others.length)];
          await sb.from('room_players').update({ alive:false }).eq('room_key', roomKey).eq('client_id', doomed.client_id);
          cascadeDeaths.push(doomed.name);
          updatedPlayers = updatedPlayers.map(p=> p.client_id===doomed.client_id ? Object.assign({},p,{alive:false}) : p);
        }
      }
      if(executed.twin_group === 'twin_pair'){
        const partner = updatedPlayers.find(p=>p.twin_group==='twin_pair' && p.client_id!==executed.client_id && p.alive);
        if(partner){
          await sb.from('room_players').update({ alive:false }).eq('room_key', roomKey).eq('client_id', partner.client_id);
          cascadeDeaths.push(partner.name);
          updatedPlayers = updatedPlayers.map(p=> p.client_id===partner.client_id ? Object.assign({},p,{alive:false}) : p);
        }
      }
    }
  }else{
    await postMessage('alive', null, null, null, null, null, '票が割れたため、処刑は行われませんでした');
  }

  for(const nm of cascadeDeaths){ await postMessage('alive', null, null, null, null, null, nm + 'が後を追いました'); }

  if(teruteruWin){
    await postMessage('alive', null, null, null, null, null, 'てるてる坊主が処刑され、単独勝利を果たしました');
    await sb.from('rooms').update({ phase:'ended', state: Object.assign({}, state, { winner:'teruteru' }) }).eq('room_key', roomKey);
    return;
  }

  const winner = computeWinner(updatedPlayers);
  if(winner){ await endGame(winner); return; }

  if(computeOnlyBots(updatedPlayers)){
    await postMessage('alive', null, null, null, null, null, '生存者が全員ボットになったため、進行を終了します');
    await sb.from('rooms').update({ phase:'ended', state: Object.assign({}, state, { winner:'no_humans' }) }).eq('room_key', roomKey);
    return;
  }

  await sb.from('rooms').update({
    phase: 'night', round: (cur.round||1) + 1,
    phase_end_at: new Date(Date.now() + nightDurationMs()).toISOString(),
    state: Object.assign({}, state, { nightActions:{}, votes:{}, deaths: [], medium_last_executed: executedId })
  }).eq('room_key', roomKey).eq('phase','vote');
  await postMessage('alive', null, null, null, null, null, ((cur.round||1)+1) + '日目の夜になりました');
}

function computeWinner(playerList){
  const real = playerList.filter(p=>p.bot_kind !== 'gm');
  if(!real.some(p=>p.role)) return null;
  const alive = real.filter(p=>p.alive);
  const fox = alive.find(p=>p.role==='fox');
  const wolves = alive.filter(p=>p.role==='werewolf'||p.role==='direwolf');
  const others = alive.filter(p=>p.role!=='werewolf' && p.role!=='direwolf' && p.role!=='fox');
  if(wolves.length === 0 && !fox){
    return 'village';
  }
  if(wolves.length >= others.length + (fox?1:0)){
    if(fox) return 'fox_dead_wolf_win';
    return 'wolf';
  }
  return null;
}

async function endGame(winner){
  let msg = '村人陣営の勝利です';
  if(winner==='wolf' || winner==='fox_dead_wolf_win') msg = '人狼陣営の勝利です';
  await postMessage('alive', null, null, null, null, null, msg);
  await sb.from('rooms').update({ phase:'ended', state: Object.assign({}, room.state, { winner }) }).eq('room_key', roomKey);
}

async function backToLobbyScreen(){
  const humanPlayers = players.filter(p=>!p.is_bot && !p.is_spectator);
  const amFirst = humanPlayers.length>0 && humanPlayers[0].client_id===clientId;
  if(amFirst){
    await sb.from('room_players').delete().eq('room_key', roomKey).eq('is_bot', true).eq('bot_kind','role');
    await sb.from('room_players').update({ alive:true, role:null, twin_group:null, seat_order:null }).eq('room_key', roomKey).neq('bot_kind','gm');
    await sb.from('rooms').update({ phase:'lobby', round:0, phase_end_at:null, state:{} }).eq('room_key', roomKey);
    await postMessage('lobby', null, null, null, null, null, 'ロビーに戻りました');
  }
  myRole = null; seerResult = null; mediumResult = null;
  showScreen('screen-lobby');
}

/* ---------- 役職Bot AI（GM Botとは別レイヤー） ---------- */

/* 第7版: フェーズ+ラウンドをキーに1回だけスケジューリングする。
   タイマー積み上がり・古いタイマー参照バグを修正。 */
function scheduleBotBehavior(){
  const key = room ? (room.phase + ':' + (room.round||0)) : null;
  if(!room || botScheduleKey === key){
    return;
  }
  clearTimeout(botTimer);
  botScheduleKey = key;
  const humanPlayers = players.filter(p=>!p.is_bot && !p.is_spectator);
  const amFirst = humanPlayers.length>0 ? humanPlayers[0].client_id === clientId : (players.filter(p=>p.bot_kind==='role').length>0 && players.filter(p=>p.bot_kind==='role')[0].client_id===clientId);
  if(!amFirst) return;
  if(room.phase === 'night') scheduleBotNightActions();
  else if(room.phase === 'day') scheduleBotChat();
  else if(room.phase === 'vote') scheduleBotVotes();
}

function scheduleBotNightActions(){
  const fast = onlyBotsLeft();
  const bots = players.filter(p=>p.is_bot && p.bot_kind==='role' && p.alive && ['werewolf','direwolf','seer','medium','knight'].includes(p.role));
  bots.forEach(bot=>{
    /* 全員ボットなら即決、それ以外はある程度の「間」を持たせて人間らしくする */
    const delay = fast ? (200 + Math.random()*800) : (2000 + Math.random()*10000);
    const t = setTimeout(async ()=>{
      const { data: cur } = await sb.from('rooms').select('phase,state').eq('room_key', roomKey).maybeSingle();
      if(!cur || cur.phase !== 'night') return;
      const state = cur.state || {};
      state.nightActions = state.nightActions || {};
      if(state.nightActions[bot.client_id]) return;
      let pool = players.filter(p=>p.alive && p.client_id!==bot.client_id);
      if(bot.role==='werewolf'||bot.role==='direwolf') pool = pool.filter(p=>p.role!=='werewolf' && p.role!=='direwolf');
      if(pool.length===0) return;
      const target = pool[Math.floor(Math.random()*pool.length)];
      if((bot.role==='werewolf'||bot.role==='direwolf') && Math.random()<0.5){
        const line = BOT_WOLF_TALK[Math.floor(Math.random()*BOT_WOLF_TALK.length)].replace('{target}', target.name);
        await postMessage('wolves', bot.client_id, bot.name, null, null, null, line);
      }
      state.nightActions[bot.client_id] = { role: bot.role, target: target.client_id };
      await sb.from('rooms').update({ state }).eq('room_key', roomKey);
      await maybeAdvanceFromNightActions(state);
    }, delay);
    botTimer = t;
  });
}

/* 第7版: bot発言を増加。メンション/キーワード反応、バンドワゴン（同調・魔女狩り心理）に対応 */
function scheduleBotChat(){
  const bots = players.filter(p=>p.is_bot && p.bot_kind==='role' && p.alive);
  if(bots.length===0) return;
  const fast = onlyBotsLeft();
  const fire = async ()=>{
    const { data: cur } = await sb.from('rooms').select('phase').eq('room_key', roomKey).maybeSingle();
    if(!cur || cur.phase !== 'day') return;
    const alive = players.filter(p=>p.alive && p.bot_kind!=='gm');
    const speaker = bots[Math.floor(Math.random()*bots.length)];
    if(!speaker.alive){ scheduleNext(); return; }
    const level = speaker.bot_level || 1;
    /* 発言確率を全体的に引き上げ、より積極的に話すようにする */
    const chance = level===3?0.95:level===2?0.85:0.7;
    if(Math.random()<chance){
      const recentMsgs = messages.filter(m=>m.channel==='alive').slice(-8);
      const suspicionMsg = recentMsgs.filter(m=>m.from_id && m.from_id!==speaker.client_id && /怪しい|投票|CO|人狼/.test(m.text||'')).slice(-1)[0];
      const pool = alive.filter(p=>p.client_id!==speaker.client_id);
      if(pool.length){
        let line;
        if(suspicionMsg && Math.random()<0.5){
          /* バンドワゴン: 直前の疑い発言に同調する（魔女狩り心理） */
          const mentionedName = pool.find(p=>suspicionMsg.text && suspicionMsg.text.includes(p.name));
          const target = mentionedName || pool[Math.floor(Math.random()*pool.length)];
          line = BOT_BANDWAGON_TEMPLATES[Math.floor(Math.random()*BOT_BANDWAGON_TEMPLATES.length)]
            .replace('{from}', suspicionMsg.from_name||'誰か').replace('{target}', target.name);
        }else{
          const target = pool[Math.floor(Math.random()*pool.length)];
          const templates = BOT_TEMPLATES[level] || BOT_TEMPLATES[1];
          line = templates[Math.floor(Math.random()*templates.length)].replace('{target}', target.name);
        }
        await postMessage('alive', speaker.client_id, speaker.name, null, null, null, line);
      }
    }
    scheduleNext();
  };
  function scheduleNext(){
    const t = setTimeout(fire, fast ? (300 + Math.random()*700) : (2500 + Math.random()*3500));
    botTimer = t;
  }
  scheduleNext();
}

/* 第7版: bot投票にも同調（バンドワゴン）心理を加え、強すぎる護衛依存を弱めた分ゲームが決着しやすいようにする */
function scheduleBotVotes(){
  const fast = onlyBotsLeft();
  const bots = players.filter(p=>p.is_bot && p.bot_kind==='role' && p.alive);
  bots.forEach(bot=>{
    const delay = fast ? (150 + Math.random()*600) : (1500 + Math.random()*6000);
    const t = setTimeout(async ()=>{
      const { data: cur } = await sb.from('rooms').select('phase,state').eq('room_key', roomKey).maybeSingle();
      if(!cur || cur.phase !== 'vote') return;
      const state = cur.state || {};
      state.votes = state.votes || {};
      if(state.votes[bot.client_id]) return;
      let pool = players.filter(p=>p.alive && p.client_id!==bot.client_id && p.bot_kind!=='gm');
      /* 既に票が集まっている相手がいれば、一定確率でそれに乗る（バンドワゴン投票） */
      const existingVotes = Object.values(state.votes||{});
      if(existingVotes.length && Math.random()<0.55){
        const tally = {};
        existingVotes.forEach(id=>{ tally[id]=(tally[id]||0)+1; });
        const topId = Object.entries(tally).sort((a,b)=>b[1]-a[1])[0][0];
        const topP = pool.find(p=>p.client_id===topId);
        if(topP){ pool = [topP]; }
      }
      if((bot.bot_level||1)>=2) pool = pool.filter(p=>p.role!=='werewolf').concat(pool.filter(p=>p.role==='werewolf' && Math.random()<0.2));
      if(pool.length===0) pool = players.filter(p=>p.alive && p.client_id!==bot.client_id && p.bot_kind!=='gm');
      const target = pool[Math.floor(Math.random()*pool.length)];
      state.votes[bot.client_id] = target.client_id;
      await sb.from('rooms').update({ state }).eq('room_key', roomKey);
      const aliveCount = players.filter(p=>p.alive && p.bot_kind!=='gm').length;
      if(Object.keys(state.votes).length >= aliveCount) await gmTryAdvancePhase();
    }, delay);
    botTimer = t;
  });
}

/* 第7版: 人間・ボット問わず新規発言に反応する（メンション・キーワード） */
function reactToNewMessage(msg){
  if(!room || room.phase!=='day') return;
  if(!msg || !msg.from_id || msg.from_id===clientId) return;
  const humanPlayers = players.filter(p=>!p.is_bot && !p.is_spectator);
  const amFirst = humanPlayers.length>0 ? humanPlayers[0].client_id === clientId : false;
  if(!amFirst) return;
  if(msg.channel!=='alive') return;
  const bots = players.filter(p=>p.is_bot && p.bot_kind==='role' && p.alive && p.client_id!==msg.from_id);
  if(bots.length===0) return;
  const text = msg.text||'';
  const mentioned = bots.find(b=>text.includes('@'+b.name) || text.includes(b.name));
  const fast = onlyBotsLeft();
  if(mentioned && Math.random()<0.8){
    setTimeout(async ()=>{
      const { data: cur } = await sb.from('rooms').select('phase').eq('room_key', roomKey).maybeSingle();
      if(!cur || cur.phase!=='day') return;
      const line = MENTION_REPLY_TEMPLATES[Math.floor(Math.random()*MENTION_REPLY_TEMPLATES.length)].replace(/\{from\}/g, msg.from_name||'誰か');
      await postMessage('alive', mentioned.client_id, mentioned.name, null, msg.id, null, line);
    }, fast ? (200+Math.random()*500) : (1200 + Math.random()*3000));
    return;
  }
  const kw = Object.keys(KEYWORD_REACT_TEMPLATES).find(k=>text.includes(k));
  if(kw && Math.random()<0.5){
    const responder = bots[Math.floor(Math.random()*bots.length)];
    setTimeout(async ()=>{
      const { data: cur } = await sb.from('rooms').select('phase').eq('room_key', roomKey).maybeSingle();
      if(!cur || cur.phase!=='day') return;
      const opts = KEYWORD_REACT_TEMPLATES[kw];
      const line = opts[Math.floor(Math.random()*opts.length)];
      await postMessage('alive', responder.client_id, responder.name, null, null, null, line);
    }, fast ? (200+Math.random()*500) : (1500 + Math.random()*3500));
  }
}

/* ---------- チャット/囁き/メンション/返信 ---------- */

async function postMessage(channel, fromId, fromName, toId, replyTo, mentions, text){
  const { error } = await sb.from('room_messages').insert({
    room_key: roomKey, channel, from_id: fromId, from_name: fromName,
    to_id: toId, reply_to: replyTo, mentions: mentions, text
  });
  if(error) debugLog('error','メッセージ送信失敗: '+error.message);
}

function neighborIds(){
  const me = players.find(p=>p.client_id===clientId);
  if(!me || me.seat_order===undefined || me.seat_order===null) return [];
  const seat = (room.state && room.state.seatOrder) || [];
  if(seat.length===0) return [];
  const idx = seat.indexOf(clientId);
  if(idx===-1) return [];
  const prev = seat[(idx-1+seat.length)%seat.length];
  const next = seat[(idx+1)%seat.length];
  return [prev,next].filter(id=>{
    const p = players.find(x=>x.client_id===id);
    return p && p.alive;
  });
}

function currentAvailableTabs(){
  const me = players.find(p=>p.client_id===clientId);
  const amAlive = me ? me.alive : true;
  const tabs = [];
  if(room && room.phase === 'lobby'){ return [{ id:'lobby', label:'ロビー' }]; }
  tabs.push({ id: amAlive ? 'alive':'dead', label: amAlive ? '生存者':'死亡者' });
  if(me && (me.role==='werewolf'||me.role==='direwolf') && me.alive) tabs.push({ id:'wolves', label:'人狼専用' });
  if(me && me.alive && me.role!=='fox' && neighborIds().length>0 && (room.phase==='day')) tabs.push({ id:'whisper', label:'囁き（隣人）' });
  if(me && me.twin_group && me.alive) tabs.push({ id:'pair', label: me.role==='mason'?'共有者トーク':'双子トーク' });
  return tabs;
}

function renderChatTabs(){
  const wrap = document.getElementById('chatTabs');
  const tabs = currentAvailableTabs();
  if(!tabs.find(t=>t.id===activeChatTab)) activeChatTab = tabs[0] ? tabs[0].id : 'alive';
  wrap.innerHTML = '';
  tabs.forEach(t=>{
    const el = document.createElement('div');
    el.className = 'chat-tab' + (t.id===activeChatTab ? ' active' : '');
    el.textContent = t.label;
    el.onclick = ()=>{ activeChatTab = t.id; renderChatArea(); };
    wrap.appendChild(el);
  });
}

function channelIsLocked(){
  if(!room) return false;
  if(amSpectator) return true;
  if(room.phase === 'lobby') return false;
  if(activeChatTab === 'wolves') return room.phase !== 'night';
  if(activeChatTab === 'whisper') return room.phase !== 'day';
  if(activeChatTab === 'pair') return false;
  return room.phase === 'night';
}

function renderMentionText(text){
  return escapeHtml(text).replace(/@([^\s@]{1,12})/g, (m,name)=>{
    const hit = players.find(p=>p.name===name);
    return hit ? '<span class="mention">@'+escapeHtml(name)+'</span>' : m;
  });
}

function visibleMessagesForChannel(chan){
  if(chan==='whisper'){
    const nb = new Set(neighborIds());
    nb.add(clientId);
    return messages.filter(m=> m.channel==='whisper' && nb.has(m.from_id) );
  }
  if(chan==='pair'){
    const me = players.find(p=>p.client_id===clientId);
    if(!me || !me.twin_group) return [];
    const groupIds = new Set(players.filter(p=>p.twin_group===me.twin_group).map(p=>p.client_id));
    return messages.filter(m=>m.channel==='pair' && groupIds.has(m.from_id));
  }
  return messages.filter(m=>m.channel===chan);
}

function renderChatArea(){
  renderChatTabs();
  const targetChan = activeChatTab;
  const list = visibleMessagesForChannel(targetChan);
  if(document.getElementById('gameLog')){
    const logEl = document.getElementById('gameLog');
    logEl.innerHTML = '';
    list.slice(-150).forEach(m=>{
      const line = document.createElement('div');
      const isSelf = m.from_id === clientId;
      line.className = 'msg' + (m.from_id===null ? ' sys' : '') + (isSelf ? ' self' : '');
      let html = '';
      if(m.reply_to){
        const orig = messages.find(x=>x.id===m.reply_to);
        if(orig) html += '<div class="mreply">→ ' + escapeHtml(orig.from_name||'') + ': ' + escapeHtml((orig.text||'').slice(0,40)) + '</div>';
      }
      if(m.from_id===null){
        html += escapeHtml(m.text);
      }else{
        html += '<span class="mfrom">' + escapeHtml(m.from_name) + '</span><span class="mtext">' + renderMentionText(m.text) + '</span>';
      }
      line.innerHTML = html;
      logEl.appendChild(line);
    });
    logEl.scrollTop = logEl.scrollHeight;

    const locked = channelIsLocked();
    document.getElementById('chatLockedNote').style.display = locked ? 'block' : 'none';
    document.getElementById('chatInputRow').style.display = locked ? 'none' : 'flex';
  }
  renderLobbyLog();
}

function onChatInputChange(){
  const input = document.getElementById('gameChatInput');
  const pop = document.getElementById('mentionPop');
  const v = input.value;
  const m = /@([^\s@]*)$/.exec(v);
  if(!m){ pop.classList.add('hidden'); return; }
  const q = m[1].toLowerCase();
  const candidates = players.filter(p=>p.name.toLowerCase().startsWith(q) && p.client_id!==clientId).slice(0,6);
  if(candidates.length===0){ pop.classList.add('hidden'); return; }
  pop.innerHTML = '';
  candidates.forEach(p=>{
    const item = document.createElement('div');
    item.className = 'mi';
    item.textContent = p.name;
    item.onclick = ()=>{
      input.value = v.slice(0, m.index) + '@' + p.name + ' ';
      pop.classList.add('hidden');
      input.focus();
    };
    pop.appendChild(item);
  });
  pop.classList.remove('hidden');
}
function onChatKeydown(e){
  if(e.key==='Enter'){ document.getElementById('mentionPop').classList.add('hidden'); sendChat('gameChatInput'); }
}
function setReply(msg){
  replyTarget = msg;
  const bar = document.getElementById('replyBar');
  bar.classList.add('show');
  document.getElementById('replyBarText').textContent = '返信: ' + msg.from_name + ' 「' + (msg.text||'').slice(0,30) + '」';
}
function clearReply(){
  replyTarget = null;
  document.getElementById('replyBar').classList.remove('show');
}

async function sendChat(inputId){
  if(amSpectator) return;
  const input = document.getElementById(inputId);
  const text = input.value.trim();
  if(!text) return;
  if(inputId==='gameChatInput' && channelIsLocked()) return;
  input.value = '';
  const mentions = players.filter(p=> text.includes('@'+p.name)).map(p=>p.client_id);
  const chan = inputId==='lobbyChatInput' ? 'lobby' : activeChatTab;
  const replyId = replyTarget ? replyTarget.id : null;
  clearReply();
  await postMessage(chan, clientId, myName, null, replyId, mentions.length?mentions:null, text);
}

/* ---------- 役職カード ---------- */

function setMyRole(role){
  myRole = role;
  seerResult = null; mediumResult = null;
  renderCurrentScreen();
}

/* ---------- ゲーム画面描画 ---------- */

function renderCurrentScreen(){
  if(!room) return;
  document.getElementById('moonIcon').className = 'moon' + (room.phase==='night'?' night':room.phase==='vote'?' vote':'');
  const active = document.querySelector('.screen.active');
  if(!active) return;
  if(active.id==='screen-lobby') renderLobby();
  if(active.id==='screen-game') renderGame();
  if(active.id==='screen-result') renderResult();
}

function roleTeamClass(role){
  const info = ROLE_INFO[role];
  if(!info) return 'village-team';
  return info.team + '-team';
}

function renderGame(){
  if(!room) return;
  if(amSpectator){
    showBanner('gameBanner', 'あなたは観戦者です。次のロビーでプレイヤーへ昇格します。');
  }else if(onlyBotsLeft()){
    showBanner('gameBanner', '生存者がボットのみになったため、進行を高速化しています。');
  }else{
    clearBanner('gameBanner');
  }

  document.getElementById('phaseTitle').textContent = room.phase==='night'?'夜':room.phase==='day'?'昼・議論':'投票';
  clearInterval(tickTimer);
  const tickEl = document.getElementById('phaseTimer');
  tickTimer = setInterval(()=>{
    if(!room || !room.phase_end_at){ tickEl.textContent='--'; return; }
    const remain = Math.max(0, Math.ceil((new Date(room.phase_end_at).getTime() - Date.now())/1000));
    tickEl.textContent = remain + '秒';
    if(remain<=0) checkPhaseTimeout();
  }, 250);

  const badgeWrap = document.getElementById('roleBadgeWrap');
  if(myRole && !amSpectator){
    const info = ROLE_INFO[myRole];
    badgeWrap.innerHTML = '<div class="role-badge ' + roleTeamClass(myRole) + '">' + info.label + '（' + TEAM_LABEL[info.team] + '）</div><div class="role-desc-box">' + info.desc + '</div>';
  }else{
    badgeWrap.innerHTML = amSpectator ? '<div class="muted">観戦中</div>' : '';
  }

  const me = players.find(p=>p.client_id===clientId);
  const amAlive = me ? me.alive : false;
  const actionArea = document.getElementById('actionArea');
  actionArea.innerHTML = '';

  if(amSpectator){
    actionArea.innerHTML = '<div class="muted">観戦中です。行動や投票はできません。</div>';
  }else if(!amAlive){
    actionArea.innerHTML = '<div class="muted">あなたは脱落しました。死亡者チャットで見守りましょう。全員の正体が確認できます。</div>';
  }else if(room.phase==='night' && ['werewolf','direwolf','seer','medium','knight'].includes(myRole)){
    const labelMap = {
      werewolf:'襲撃する相手を選んでください', direwolf:'襲撃する相手を選んでください',
      seer:'占う相手を選んでください', medium:'（霊媒結果は昼に処刑者があれば自動表示されます）',
      knight:'守る相手を選んでください'
    };
    const wrap = document.createElement('div');
    wrap.innerHTML = '<div class="label" style="margin-top:0">' + labelMap[myRole] + '</div>';
    if(myRole!=='medium'){
      const list = document.createElement('div');
      list.className = 'target-list';
      const state = room.state || {};
      const already = (state.nightActions||{})[clientId];
      players.filter(p=>p.alive && p.client_id!==clientId && p.bot_kind!=='gm').forEach(p=>{
        if((myRole==='werewolf'||myRole==='direwolf') && (p.role==='werewolf'||p.role==='direwolf')) return;
        const row = document.createElement('div');
        row.className = 'target' + (selectedTarget===p.client_id||(already&&already.target===p.client_id)?' selected':'');
        row.textContent = p.name;
        row.onclick = async ()=>{
          selectedTarget = p.client_id;
          await handleNightAction(p.client_id);
          renderGame();
        };
        list.appendChild(row);
      });
      wrap.appendChild(list);
    }
    actionArea.appendChild(wrap);
    if(myRole==='seer' && seerResult){
      const r = document.createElement('div');
      r.className = 'muted'; r.style.marginTop = '10px';
      r.textContent = '占い結果：' + seerResult.target + ' は ' + (seerResult.isFox ? '妖狐（死亡しました）' : (seerResult.isWerewolf?'人狼':'人狼ではない'));
      actionArea.appendChild(r);
    }
    if(myRole==='medium' && mediumResult){
      const r = document.createElement('div');
      r.className = 'muted'; r.style.marginTop = '10px';
      r.textContent = '霊媒結果：' + mediumResult.target + ' は ' + (mediumResult.isWerewolf?'人狼だった':'人狼ではなかった');
      actionArea.appendChild(r);
    }
  }else if(room.phase==='night'){
    actionArea.innerHTML = '<div class="muted">役職を持つ人が行動中です。夜が明けるのを待っています…（全員の行動が終わり次第、自動で進行します）</div>';
  }else if(room.phase==='day'){
    actionArea.innerHTML = '<div class="muted">生存者で議論しましょう。まもなく投票が始まります。</div>';
  }else if(room.phase==='vote'){
    const wrap = document.createElement('div');
    wrap.innerHTML = '<div class="label" style="margin-top:0">処刑する相手に投票してください</div>';
    const list = document.createElement('div');
    list.className = 'target-list';
    const state = room.state || {};
    const already = (state.votes||{})[clientId];
    players.filter(p=>p.alive && p.bot_kind!=='gm').forEach(p=>{
      const row = document.createElement('div');
      row.className = 'target' + (selectedVote===p.client_id||already===p.client_id?' selected':'');
      row.textContent = p.name + (p.client_id===clientId?'（自分）':'');
      row.onclick = async ()=>{
        selectedVote = p.client_id;
        await handleVote(p.client_id);
        renderGame();
      };
      list.appendChild(row);
    });
    wrap.appendChild(list);
    actionArea.appendChild(wrap);
  }

  const list = document.getElementById('gamePlayers');
  list.innerHTML = '';
  const showAllRoles = !amAlive || amSpectator;
  players.filter(p=>p.bot_kind!=='gm').forEach(p=>{
    const row = document.createElement('div');
    row.className = 'p-row' + (p.client_id===clientId?' me':'') + (!p.alive?' dead':'');
    row.innerHTML = '<span class="nm">' + escapeHtml(p.name) + (p.is_bot?' 🤖':'') + '</span>';
    if(showAllRoles && p.role){
      const rv = document.createElement('span');
      rv.className = 'revealed';
      rv.textContent = ROLE_INFO[p.role] ? ROLE_INFO[p.role].label : p.role;
      row.appendChild(rv);
    }else{
      const known = knownRoleOf(me, p);
      if(known && ROLE_INFO[known]){
        const kv = document.createElement('span');
        kv.className = 'known-role';
        kv.textContent = '(' + ROLE_INFO[known].label + ')';
        row.appendChild(kv);
      }
    }
    if(p.client_id!==clientId && p.alive && room.phase!=='night' && !amSpectator){
      const mtn = document.createElement('button');
      mtn.className = 'mtn-btn';
      mtn.textContent = '@';
      mtn.title = 'メンション';
      mtn.onclick = ()=>{
        const input = document.getElementById('gameChatInput');
        input.value += (input.value && !input.value.endsWith(' ') ? ' ' : '') + '@' + p.name + ' ';
        input.focus();
      };
      row.appendChild(mtn);
    }
    list.appendChild(row);
  });

  renderChatArea();

  if(room.phase!=='night'){ selectedTarget=null; }
  if(room.phase!=='vote'){ selectedVote=null; }
}

function renderResult(){
  const win = room.state && room.state.winner;
  let title = '村人陣営の勝利';
  if(win==='wolf'||win==='fox_dead_wolf_win') title = '人狼陣営の勝利';
  if(win==='teruteru') title = 'てるてる坊主の単独勝利';
  if(win==='no_humans') title = '進行終了（生存者が全員ボット）';
  document.getElementById('resultTitle').textContent = title;
  const roleLines = players.filter(p=>p.bot_kind!=='gm').map(p=> p.name + '：' + (ROLE_INFO[p.role] ? ROLE_INFO[p.role].label : '村人'));
  document.getElementById('resultSub').textContent = roleLines.join(' ／ ');
}

function showBanner(id, text){
  const el = document.getElementById(id);
  if(el) el.innerHTML = '<div class="banner">' + escapeHtml(text) + '</div>';
}
function clearBanner(id){
  const el = document.getElementById(id);
  if(el) el.innerHTML = '';
}

/* ---------- 退出 / リセット ---------- */

async function leaveRoom(){
  leavingIntentionally = true;
  clearInterval(presenceTimer);
  clearInterval(tickTimer);
  clearTimeout(botTimer);
  unsubscribeRealtime();
  try{
    await sb.from('room_players').delete().eq('room_key', roomKey).eq('client_id', clientId);
    const { count } = await sb.from('room_players').select('*', { count:'exact', head:true }).eq('room_key', roomKey).neq('bot_kind','gm');
    if((count||0) === 0 && roomKey !== OFFICIAL_KEY){
      await sb.from('rooms').delete().eq('room_key', roomKey);
    }
  }catch(e){ debugLog('error','退出処理エラー: ' + e.message); }
  hardResetToMenu();
}
function hardResetToMenu(){
  roomKey=''; roomName=''; room=null; players=[]; messages=[];
  myRole=null; seerResult=null; mediumResult=null; amSpectator=false;
  activeChatTab='lobby'; dmSelectedId=null; replyTarget=null;
  botScheduleKey=null;
  leavingIntentionally = false;
  document.getElementById('topRoomTag').textContent = '';
  showScreen('screen-menu');
}

window.addEventListener('beforeunload', ()=>{
  if(roomKey && clientId){
    try{
      navigator.sendBeacon && navigator.sendBeacon(
        SUPABASE_URL + '/rest/v1/room_players?room_key=eq.' + encodeURIComponent(roomKey) + '&client_id=eq.' + encodeURIComponent(clientId),
        new Blob([JSON.stringify({})], { type:'application/json' })
      );
    }catch(e){}
  }
});
</script>
